services:
  vane:
    image: itzcrazykns1337/vane:latest
    build:
      context: .
    ports:
      - '127.0.0.1:8090:3000'
      - '100.94.95.76:8090:3000'
    volumes:
      - data:/home/vane/data
    restart: unless-stopped
    environment:
      # Next standalone binds to $HOSTNAME; with multiple networks the container
      # hostname resolves to only one of them, breaking the published port.
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - searxng
    # Authentication config (optional — see docs/ADMIN.md).
    # The data volume above persists the auto-generated JWT secret, so a single
    # instance needs nothing here. For production / multi-replica, uncomment:
    # environment:
    #   # Stable signing secret (REQUIRED if you run more than one replica).
    #   # Generate with: openssl rand -base64 48
    #   - JWT_SECRET=change-me-to-a-random-32+-byte-string
    #   # Set when serving over HTTPS (e.g. behind a TLS reverse proxy) so auth
    #   # cookies always get the Secure flag.
    #   - FORCE_SECURE_COOKIES=true

networks:
  searxng:
    external: true
    name: searxng_default

volumes:
  data:
    name: 'vane-data'
